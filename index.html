<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0816" />
  <title>盲盒抽取</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,700&family=Noto+Serif+SC:wght@500;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- 背景层：极光 + 噪点 -->
  <div class="aurora" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <main class="stage">
    <header class="masthead">
      <p class="eyebrow">✦ Mystery Cabinet ✦</p>
      <h1 class="title" id="title">命运盲盒</h1>
      <p class="subtitle" id="subtitle">点一下，让命运替你选。</p>
    </header>

    <!-- 盲盒舞台：盒子和结果共用同一区域 -->
    <section class="box-stage" aria-live="polite">
      <div class="box" id="box" data-state="idle">
        <div class="box-glow" aria-hidden="true"></div>
        <div class="box-shadow" aria-hidden="true"></div>
        <div class="box-base">
          <span class="question-mark" aria-hidden="true">?</span>
          <div class="box-base-pattern" aria-hidden="true"></div>
        </div>
        <div class="box-lid">
          <span class="ribbon-v" aria-hidden="true"></span>
          <span class="ribbon-h" aria-hidden="true"></span>
          <span class="bow" aria-hidden="true"></span>
        </div>
        <div class="sparkles" aria-hidden="true">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>
      </div>

      <!-- 结果卡：默认隐藏，抽中后覆盖盒子 -->
      <article class="result" id="result" hidden>
        <span class="result-badge" id="resultBadge">稀有</span>
        <div class="result-emoji" id="resultEmoji">✦</div>
        <h2 class="result-text" id="resultText">—</h2>
        <p class="result-desc" id="resultDesc"></p>
      </article>

      <!-- 引导提示：未抽取时显示 -->
      <p class="hint" id="hint">轻点下方按钮 · 召唤你的命运</p>
    </section>

    <div class="actions">
      <button class="draw-btn" id="drawBtn" type="button">
        <span class="draw-btn-glow" aria-hidden="true"></span>
        <span class="draw-btn-text" id="drawBtnText">抽一个</span>
      </button>
      <button class="reset-btn" id="resetBtn" type="button">
        <span id="resetBtnText">清空记录</span>
      </button>
    </div>

    <section class="history" id="historySection" hidden>
      <header class="history-head">
        <span class="history-rule" aria-hidden="true"></span>
        <h3 class="history-title" id="historyTitle">抽签记录</h3>
        <span class="history-rule" aria-hidden="true"></span>
      </header>
      <ol class="history-list" id="historyList"></ol>
    </section>


  </main>

  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
